[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid
user=root

[program:web]
command=/usr/local/bin/apache2-foreground
priority=10
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:membership-mail]
command=/usr/local/bin/php artisan queue:work database --queue=membership-mail --sleep=3 --tries=3 --timeout=30 --max-time=3600 --memory=96 --no-interaction
directory=/var/www/html
user=www-data
priority=20
autostart=true
autorestart=true
startsecs=1
startretries=5
stopwaitsecs=40
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:membership-scheduler]
command=/usr/local/bin/php artisan schedule:work --no-interaction
directory=/var/www/html
user=www-data
priority=30
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
